name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test suite
        run: python -m pytest -q

      - name: Compile source
        run: python -m compileall -q src

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Validate checked-in fixture bundles
        run: |
          for bundle in scenarios/fixtures/verified/*.json; do
            echo "::group::$bundle"
            python -m athena_procurement_arena validate-bundle --bundle "$bundle"
            echo "::endgroup::"
          done
