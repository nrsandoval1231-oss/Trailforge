name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4
      - name: Install project and checks
        run: |
          & 'C:\Users\nrsan\AppData\Local\Programs\Python\Python313\python.exe' -m pip install --upgrade pip
          & 'C:\Users\nrsan\AppData\Local\Programs\Python\Python313\python.exe' -m pip install -e . pytest ruff
      - name: Test suite
        run: '& ''C:\Users\nrsan\AppData\Local\Programs\Python\Python313\python.exe'' -m pytest -q'
      - name: Compile source
        run: '& ''C:\Users\nrsan\AppData\Local\Programs\Python\Python313\python.exe'' -m compileall -q src'
      - name: Ruff
        run: '& ''C:\Users\nrsan\AppData\Local\Programs\Python\Python313\Scripts\ruff.exe'' check src tests'
