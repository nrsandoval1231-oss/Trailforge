name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4
      - name: Install project and checks
        run: |
          & 'C:\Users\nrsan\AppData\Roaming\uv\python\cpython-3.11.16-windows-x86_64-none\python.exe' -m pip install --break-system-packages --upgrade pip
          & 'C:\Users\nrsan\AppData\Roaming\uv\python\cpython-3.11.16-windows-x86_64-none\python.exe' -m pip install --break-system-packages -e . pytest ruff
      - name: Test suite
        run: '& ''C:\Users\nrsan\AppData\Roaming\uv\python\cpython-3.11.16-windows-x86_64-none\python.exe'' -m pytest -q'
      - name: Compile source
        run: '& ''C:\Users\nrsan\AppData\Roaming\uv\python\cpython-3.11.16-windows-x86_64-none\python.exe'' -m compileall -q src'
      - name: Ruff
        run: '& ''C:\Users\nrsan\AppData\Roaming\uv\python\cpython-3.11.16-windows-x86_64-none\python.exe'' -m ruff check src tests'
