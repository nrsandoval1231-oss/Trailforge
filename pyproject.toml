[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-trailforge"
version = "0.1.0"
description = "Customer-first power project desk and deterministic research Arena"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
trailforge = "athena_procurement_arena.cli:main"
trailforge-ui = "athena_procurement_arena.local_ui:main"
trailforge-operator = "athena_procurement_arena.operator:main"

[tool.setuptools.package-data]
athena_procurement_arena = ["ui_assets/*.html", "ui_assets/*.css", "ui_assets/*.js", "operator_assets/*.html", "operator_assets/*.css", "operator_assets/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a future Ruff default change cannot silently alter the gate.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
