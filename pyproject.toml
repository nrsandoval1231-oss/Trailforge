[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-trailforge"
version = "0.1.0"
description = "Deterministic research-only procurement intelligence arena"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
trailforge = "athena_procurement_arena.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a future Ruff default change cannot silently alter the gate.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
