[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-trailforge"
version = "0.1.0"
description = "Deterministic research-only procurement intelligence arena"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "tinycss2>=1.4", "cssselect2>=0.8"]
brand = ["CairoSVG>=2.7", "fonttools>=4", "Pillow>=10"]

[project.scripts]
trailforge-mining = "athena_procurement_arena.mining:main"
trailforge = "athena_procurement_arena.cli:main"
trailforge-ui = "athena_procurement_arena.local_ui:main"
trailforge-discovery = "athena_procurement_arena.discovery_cli:main"
trailforge-opportunity = "athena_procurement_arena.opportunity_cli:main"

[tool.setuptools.package-data]
athena_procurement_arena = ["ui_assets/*.html", "ui_assets/*.css", "ui_assets/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a future Ruff default change cannot silently alter the gate.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
